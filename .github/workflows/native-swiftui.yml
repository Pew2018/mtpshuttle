name: "02 - Finder to Android Drag and Drop"

on:
  push:
    branches:
      - "native/**"
      - "feature/**"
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: "02 - Build Finder to Android drag and drop (arm64)"
    runs-on: macos-14
    defaults:
      run:
        working-directory: native/OpenMTPNative
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: ffi/kalam/native/go.sum
      - name: Build updated MTP backend
        run: |
          brew install libusb
          cd ../../ffi/kalam/native
          export PKG_CONFIG_PATH="$(brew --prefix libusb)/lib/pkgconfig"
          CGO_ENABLED=1 GOARCH=arm64 GOOS=darwin go build -trimpath -buildmode=c-shared -o ../../../build/mac/bin/arm64/kalam.dylib ./*.go
          LIBUSB_LINK="$(otool -L ../../../build/mac/bin/arm64/kalam.dylib | awk '/libusb-1.0.0.dylib/ {print $1; exit}')"
          install_name_tool -change "$LIBUSB_LINK" @loader_path/libusb.dylib ../../../build/mac/bin/arm64/kalam.dylib
          cp "$(brew --prefix libusb)/lib/libusb-1.0.0.dylib" ../../../build/mac/bin/arm64/libusb.dylib
          install_name_tool -id @loader_path/libusb.dylib ../../../build/mac/bin/arm64/libusb.dylib
          cp ../../../build/mac/bin/arm64/kalam.dylib ../../../build/mac/bin/arm64/kalam-seg5.dylib
          install_name_tool -change @loader_path/libusb.dylib @loader_path/libusb-seg5.dylib ../../../build/mac/bin/arm64/kalam-seg5.dylib
          cp ../../../build/mac/bin/arm64/libusb.dylib ../../../build/mac/bin/arm64/libusb-seg5.dylib
          install_name_tool -id @loader_path/libusb-seg5.dylib ../../../build/mac/bin/arm64/libusb-seg5.dylib
      - name: Show build environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Verify Kalam inputs
        run: |
          test -f ../../build/mac/bin/arm64/kalam.dylib
          test -f ../../build/mac/bin/arm64/libusb.dylib
          file ../../build/mac/bin/arm64/kalam.dylib
          file ../../build/mac/bin/arm64/libusb.dylib
      - name: Check directory browsing and Kalam response mapping
        run: swift test
      - name: Build arm64 app
        run: ./scripts/build-app.sh
      - name: Verify application bundle
        run: |
          APP="dist/MTP Shuttle.app"
          BIN="$APP/Contents/MacOS/SwiftMTP"
          test -d "$APP/Contents/MacOS"
          test -f "$APP/Contents/Info.plist"
          test -x "$BIN"
          test -f "$APP/Contents/Resources/Kalam/standard/kalam.dylib"
          test -f "$APP/Contents/Resources/Kalam/standard/libusb.dylib"
          file "$BIN"
          lipo -info "$BIN"
          otool -L "$APP/Contents/Resources/Kalam/standard/kalam.dylib"
          otool -L "$APP/Contents/Resources/Kalam/standard/libusb.dylib"
          plutil -p "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Audit native bundle contents
        run: |
          APP="dist/MTP Shuttle.app"
          test "$(find "$APP/Contents" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "4"
          test -d "$APP/Contents/_CodeSignature"
          test ! -e "$APP/Contents/Resources/app"
          test ! -e "$APP/Contents/Resources/node_modules"
          test ! -e "$APP/Contents/Resources/electron"
          test ! -e "$APP/Contents/Resources/package.json"
          test ! -e "$APP/Contents/Resources/webpack"
          du -sh "$APP"
          find "$APP/Contents" -maxdepth 4 -type f -print | sort
      - name: Verify artifact has a single app at its root
        run: |
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1"
          test -d "dist/MTP Shuttle.app"
          test -z "$(find dist -type f -name '*.zip' -print -quit)"
          test -x "dist/MTP Shuttle.app/Contents/MacOS/SwiftMTP"
      - name: Package and verify downloadable ZIP
        run: |
          (cd dist && ditto -c -k --keepParent "MTP Shuttle.app" MTP-Shuttle.zip)
          test "$(unzip -Z -1 dist/MTP-Shuttle.zip | cut -d/ -f1 | sort -u)" = "MTP Shuttle.app"
          EXTRACTED="$(mktemp -d)"
          trap 'rm -rf "$EXTRACTED"' EXIT
          ditto -x -k dist/MTP-Shuttle.zip "$EXTRACTED"
          test "$(find "$EXTRACTED" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1"
          test -x "$EXTRACTED/MTP Shuttle.app/Contents/MacOS/SwiftMTP"
          test -f "$EXTRACTED/MTP Shuttle.app/Contents/Info.plist"
          codesign --verify --deep --strict "$EXTRACTED/MTP Shuttle.app"
      - name: Upload arm64 test ZIP
        uses: actions/upload-artifact@v7
        with:
          path: native/OpenMTPNative/dist/MTP-Shuttle.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
