name: Native SwiftUI CI

on:
  push:
    branches:
      - "native/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build native SwiftUI app (arm64)
    runs-on: macos-14
    defaults:
      run:
        working-directory: native/OpenMTPNative
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show build environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Verify Kalam inputs
        run: |
          test -f ../../build/mac/bin/arm64/kalam.dylib
          test -f ../../build/mac/bin/arm64/libusb.dylib
          file ../../build/mac/bin/arm64/kalam.dylib
          file ../../build/mac/bin/arm64/libusb.dylib
      - name: Check directory browsing and Kalam response mapping
        run: swift test
      - name: Build arm64 app
        run: ./scripts/build-app.sh
      - name: Verify application bundle
        run: |
          APP="dist/SwiftMTP.app"
          BIN="$APP/Contents/MacOS/SwiftMTP"
          test -d "$APP/Contents/MacOS"
          test -f "$APP/Contents/Info.plist"
          test -x "$BIN"
          test -f "$APP/Contents/Resources/Kalam/standard/kalam.dylib"
          test -f "$APP/Contents/Resources/Kalam/standard/libusb.dylib"
          file "$BIN"
          lipo -info "$BIN"
          otool -L "$APP/Contents/Resources/Kalam/standard/kalam.dylib"
          otool -L "$APP/Contents/Resources/Kalam/standard/libusb.dylib"
          plutil -p "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Upload arm64 app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SwiftMTP-0.1.0-arm64
          path: native/OpenMTPNative/dist/SwiftMTP-arm64.zip
          if-no-files-found: error
          retention-days: 14
