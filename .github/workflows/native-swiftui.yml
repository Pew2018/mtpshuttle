name: Native SwiftUI CI

on:
  push:
    branches:
      - "native/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build native SwiftUI app (arm64)
    runs-on: macos-14

    defaults:
      run:
        working-directory: native/OpenMTPNative

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build arm64 app
        run: ./scripts/build-app.sh

      - name: Verify application bundle
        run: |
          APP="dist/OpenMTP.app"
          BIN="$APP/Contents/MacOS/OpenMTPNative"

          test -d "$APP/Contents/MacOS"
          test -f "$APP/Contents/Info.plist"
          test -x "$BIN"

          echo "Executable:"
          file "$BIN"

          echo "Architecture:"
          lipo -info "$BIN"

          echo "Bundle metadata:"
          plutil -p "$APP/Contents/Info.plist"

          echo "Code signature:"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload arm64 app bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenMTP-Native-ARM64
          path: native/OpenMTPNative/dist/OpenMTP.app
          if-no-files-found: error
          retention-days: 14
