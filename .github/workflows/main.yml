name: Legacy Electron CI (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'
      - name: Install cross-env
        run: npm install -g cross-env
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build legacy Electron application
        run: |
          yarn
          yarn build
      - name: Package unsigned macOS application
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          yarn package-mac-without-notarize
      - name: Verify macOS application exists
        run: test -e dist/mac/OpenMTP.app
